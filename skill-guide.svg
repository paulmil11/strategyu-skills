<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#b4aeab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fff"/>

  <!-- Title -->
  <text x="48" y="54" font-size="30" font-weight="700" fill="#272323" letter-spacing="-0.5">StrategyU AI Skills</text>
  <text x="48" y="80" font-size="14" fill="#5a5656">Five skills, one for each step of strategy work. Start with the step you're on.</text>

  <!-- Step 1: Frame -->
  <rect x="48.5" y="108.5" width="251" height="243" rx="14" fill="#FDEFF0" stroke="#E63946" stroke-opacity="0.16"/>
  <text x="70" y="140" font-size="11" font-weight="700" fill="#E63946" letter-spacing="1">STEP 1 · DEFINE THE PROBLEM</text>
  <text x="70" y="172" font-size="22" font-weight="700" fill="#272323">Frame</text>
  <text x="278" y="172" font-size="10" font-weight="600" fill="#E63946" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-frame</text>
  <text x="70" y="208" font-size="13" fill="#5a5656">Turns a messy situation into a</text>
  <text x="70" y="226" font-size="13" fill="#5a5656">clear problem, hypotheses to</text>
  <text x="70" y="244" font-size="13" fill="#5a5656">test, and an issue tree.</text>
  <text x="70" y="292" font-size="11" font-weight="700" fill="#E63946" letter-spacing="0.5">USE IT WHEN</text>
  <text x="70" y="310" font-size="12" fill="#5a5656">you're not sure what you're</text>
  <text x="70" y="326" font-size="12" fill="#5a5656">really trying to solve.</text>

  <line x1="303" y1="230" x2="321" y2="230" stroke="#b4aeab" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 2: Structure -->
  <rect x="324.5" y="108.5" width="251" height="243" rx="14" fill="#EEF7F6" stroke="#2A9D8F" stroke-opacity="0.16"/>
  <text x="346" y="140" font-size="11" font-weight="700" fill="#2A9D8F" letter-spacing="1">STEP 2 · BUILD THE ARGUMENT</text>
  <text x="346" y="172" font-size="22" font-weight="700" fill="#272323">Structure</text>
  <text x="554" y="172" font-size="10" font-weight="600" fill="#2A9D8F" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-structure</text>
  <text x="346" y="208" font-size="13" fill="#5a5656">Turns notes, research, and data</text>
  <text x="346" y="226" font-size="13" fill="#5a5656">into one main point and the</text>
  <text x="346" y="244" font-size="13" fill="#5a5656">reasons that support it.</text>
  <text x="346" y="292" font-size="11" font-weight="700" fill="#2A9D8F" letter-spacing="0.5">USE IT WHEN</text>
  <text x="346" y="310" font-size="12" fill="#5a5656">you have a lot of information</text>
  <text x="346" y="326" font-size="12" fill="#5a5656">and no answer yet.</text>

  <line x1="579" y1="230" x2="597" y2="230" stroke="#b4aeab" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 3: Storyline -->
  <rect x="600.5" y="108.5" width="251" height="243" rx="14" fill="#F0F4F7" stroke="#457B9D" stroke-opacity="0.16"/>
  <text x="622" y="140" font-size="11" font-weight="700" fill="#457B9D" letter-spacing="1">STEP 3 · GET IT ACROSS</text>
  <text x="622" y="172" font-size="22" font-weight="700" fill="#272323">Storyline</text>
  <text x="830" y="172" font-size="10" font-weight="600" fill="#457B9D" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-storyline</text>
  <text x="622" y="208" font-size="13" fill="#5a5656">Writes the email or memo, or</text>
  <text x="622" y="226" font-size="13" fill="#5a5656">builds the deck and checks every</text>
  <text x="622" y="244" font-size="13" fill="#5a5656">slide. It also reviews decks</text>
  <text x="622" y="262" font-size="13" fill="#5a5656">you already have.</text>
  <text x="622" y="292" font-size="11" font-weight="700" fill="#457B9D" letter-spacing="0.5">USE IT WHEN</text>
  <text x="622" y="310" font-size="12" fill="#5a5656">you know the answer and need</text>
  <text x="622" y="326" font-size="12" fill="#5a5656">other people to get it.</text>

  <!-- Writing: built into every skill -->
  <rect x="48.5" y="376.5" width="803" height="83" rx="14" fill="#FBF4F0" stroke="#C87941" stroke-opacity="0.16"/>
  <text x="70" y="404" font-size="11" font-weight="700" fill="#C87941" letter-spacing="1">IN EVERY STEP</text>
  <text x="70" y="428" font-size="18" font-weight="700" fill="#272323">Writing</text>
  <text x="70" y="446" font-size="10" font-weight="600" fill="#C87941" font-family="'SF Mono', Consolas, monospace">/su-writing</text>
  <text x="206" y="414" font-size="13" fill="#5a5656">Built into all three steps. It cuts AI phrasing, filler, and vague claims.</text>
  <text x="206" y="434" font-size="13" fill="#5a5656">Use it on its own to edit any memo, email, or slide.</text>

  <!-- Coach: all in one -->
  <rect x="48" y="480" width="804" height="104" rx="14" fill="#1A1A2E"/>
  <text x="70" y="510" font-size="11" font-weight="700" fill="#c9c4d9" letter-spacing="1">ALL IN ONE</text>
  <text x="70" y="534" font-size="18" font-weight="700" fill="#fff">Coach</text>
  <text x="70" y="552" font-size="10" font-weight="600" fill="#c9c4d9" font-family="'SF Mono', Consolas, monospace">/su-coach</text>
  <text x="206" y="516" font-size="13" fill="#fff">All five skills in one file. It works out which step you're on and takes</text>
  <text x="206" y="536" font-size="13" fill="#fff">you from the problem to the finished deck.</text>
  <text x="206" y="564" font-size="12" fill="rgba(255,255,255,0.7)">Use it when you want help from the start, or your AI tool only takes one file.</text>

  <!-- Footer -->
  <text x="48" y="616" font-size="12" fill="#8a8585">Not sure where to start? Ask Coach.</text>
</svg>
