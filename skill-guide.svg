<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#9a948a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="48" y="54" font-size="30" font-weight="700" fill="#1a1a2e" letter-spacing="-0.5">StrategyU AI Skills</text>
  <text x="48" y="80" font-size="14" fill="#666">Five skills, one for each step of strategy work. Start with the step you're on.</text>

  <!-- Step 1: Frame -->
  <rect x="48" y="108" width="252" height="244" rx="10" fill="#fff" filter="url(#shadow)"/>
  <path d="M58 108 H290 A10 10 0 0 1 300 118 V182 H48 V118 A10 10 0 0 1 58 108 Z" fill="#E63946"/>
  <text x="68" y="134" font-size="11" font-weight="700" fill="rgba(255,255,255,0.75)" letter-spacing="1">STEP 1 · DEFINE THE PROBLEM</text>
  <text x="68" y="165" font-size="22" font-weight="700" fill="#fff">Frame</text>
  <text x="282" y="165" font-size="10" fill="rgba(255,255,255,0.7)" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-frame</text>
  <text x="68" y="212" font-size="13" fill="#333">Turns a messy situation into a</text>
  <text x="68" y="230" font-size="13" fill="#333">clear problem, hypotheses to</text>
  <text x="68" y="248" font-size="13" fill="#333">test, and an issue tree.</text>
  <text x="68" y="292" font-size="11" font-weight="700" fill="#E63946" letter-spacing="0.5">USE IT WHEN</text>
  <text x="68" y="310" font-size="12" fill="#555">you're not sure what you're</text>
  <text x="68" y="326" font-size="12" fill="#555">really trying to solve.</text>

  <line x1="303" y1="230" x2="321" y2="230" stroke="#9a948a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 2: Structure -->
  <rect x="324" y="108" width="252" height="244" rx="10" fill="#fff" filter="url(#shadow)"/>
  <path d="M334 108 H566 A10 10 0 0 1 576 118 V182 H324 V118 A10 10 0 0 1 334 108 Z" fill="#2A9D8F"/>
  <text x="344" y="134" font-size="11" font-weight="700" fill="rgba(255,255,255,0.75)" letter-spacing="1">STEP 2 · BUILD THE ARGUMENT</text>
  <text x="344" y="165" font-size="22" font-weight="700" fill="#fff">Structure</text>
  <text x="558" y="165" font-size="10" fill="rgba(255,255,255,0.7)" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-structure</text>
  <text x="344" y="212" font-size="13" fill="#333">Turns notes, research, and data</text>
  <text x="344" y="230" font-size="13" fill="#333">into one main point and the</text>
  <text x="344" y="248" font-size="13" fill="#333">reasons that support it.</text>
  <text x="344" y="292" font-size="11" font-weight="700" fill="#2A9D8F" letter-spacing="0.5">USE IT WHEN</text>
  <text x="344" y="310" font-size="12" fill="#555">you have a lot of information</text>
  <text x="344" y="326" font-size="12" fill="#555">and no answer yet.</text>

  <line x1="579" y1="230" x2="597" y2="230" stroke="#9a948a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 3: Storyline -->
  <rect x="600" y="108" width="252" height="244" rx="10" fill="#fff" filter="url(#shadow)"/>
  <path d="M610 108 H842 A10 10 0 0 1 852 118 V182 H600 V118 A10 10 0 0 1 610 108 Z" fill="#457B9D"/>
  <text x="620" y="134" font-size="11" font-weight="700" fill="rgba(255,255,255,0.75)" letter-spacing="1">STEP 3 · GET IT ACROSS</text>
  <text x="620" y="165" font-size="22" font-weight="700" fill="#fff">Storyline</text>
  <text x="834" y="165" font-size="10" fill="rgba(255,255,255,0.7)" font-family="'SF Mono', Consolas, monospace" text-anchor="end">/su-storyline</text>
  <text x="620" y="212" font-size="13" fill="#333">Writes the email or memo, or</text>
  <text x="620" y="230" font-size="13" fill="#333">builds the deck and checks every</text>
  <text x="620" y="248" font-size="13" fill="#333">slide. It also reviews decks</text>
  <text x="620" y="266" font-size="13" fill="#333">you already have.</text>
  <text x="620" y="292" font-size="11" font-weight="700" fill="#457B9D" letter-spacing="0.5">USE IT WHEN</text>
  <text x="620" y="310" font-size="12" fill="#555">you know the answer and need</text>
  <text x="620" y="326" font-size="12" fill="#555">other people to get it.</text>

  <!-- Writing: built into every skill -->
  <rect x="48" y="376" width="804" height="76" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="68" y="408" font-size="18" font-weight="700" fill="#C87941">Writing</text>
  <text x="68" y="430" font-size="10" fill="#9a948a" font-family="'SF Mono', Consolas, monospace">/su-writing</text>
  <text x="196" y="408" font-size="13" fill="#333">Built into all three steps. It cuts AI phrasing, filler, and vague claims.</text>
  <text x="196" y="428" font-size="13" fill="#333">Use it on its own to edit any memo, email, or slide.</text>

  <!-- Coach: all in one -->
  <rect x="48" y="472" width="804" height="104" rx="10" fill="#1A1A2E" filter="url(#shadow)"/>
  <text x="68" y="508" font-size="18" font-weight="700" fill="#fff">Coach</text>
  <text x="68" y="530" font-size="10" fill="rgba(255,255,255,0.55)" font-family="'SF Mono', Consolas, monospace">/su-coach</text>
  <text x="196" y="508" font-size="13" fill="#fff">All five skills in one file. It works out which step you're on and takes</text>
  <text x="196" y="528" font-size="13" fill="#fff">you from the problem to the finished deck.</text>
  <text x="196" y="556" font-size="12" fill="rgba(255,255,255,0.7)">Use it when you want help from the start, or your AI tool only takes one file.</text>

  <!-- Footer -->
  <text x="48" y="612" font-size="12" fill="#888">Not sure where to start? Ask Coach.</text>
</svg>
